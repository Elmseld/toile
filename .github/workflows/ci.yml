name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  elixir:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      # Bundles assets/js/app.js, which imports the engine from engine/src (ADR 0006), so a broken
      # import or engine code esbuild cannot bundle fails CI. Tailwind is not needed for that.
      - run: mix esbuild.install --if-missing
      - run: mix esbuild toile
      - run: mix gettext.extract --check-up-to-date
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix test --cover

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/check-tool-versions
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: toile-dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
